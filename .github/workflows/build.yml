name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile dylib for iOS
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
          -fobjc-arc \
          -framework Foundation \
          -framework UIKit \
          -framework WebKit \
          Main.m -o RelifeHook.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: relifehook-dylib
          path: RelifeHook.dylib
